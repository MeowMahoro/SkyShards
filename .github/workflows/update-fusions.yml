name: Update Fusion Data

on:
  # Forks are not dispatched by the upstream repo, so poll for new parser
  # releases on a schedule instead. Every 6h (UTC). Can also be run manually.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [update-fusion-data]

# NOTE: cannot gate this job on secrets.PAT at job level (Actions forbids secrets
# in `jobs.<id>.if`). Without the secret the checkout step fails loudly, so only
# enable the schedule after adding the `PAT` repository secret.
jobs:
  update-fusion-data:
    runs-on: ubuntu-latest
    steps:
      - name: Set target branch
        run: |
          echo "TARGET_BRANCH=${{ github.event.client_payload.target_branch || 'master' }}" >> $GITHUB_ENV

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          ref: ${{ env.TARGET_BRANCH }}

      - name: Resolve source release
        run: |
          TAG="${{ github.event.client_payload.release_tag }}"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            TAG=$(curl -sS https://api.github.com/repos/Campionnn/SkyShards-Parser/releases/latest | jq -r '.tag_name')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Could not resolve a parser release to pull from" >&2
            exit 1
          fi
          echo "Pulling fusion data from parser release $TAG"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Download fusion data from source repo release
        run: |
          RELEASE_JSON=$(curl -sS "https://api.github.com/repos/Campionnn/SkyShards-Parser/releases/tags/$RELEASE_TAG")
          ASSET_URL_DATA=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "fusion-data.json") | .browser_download_url')
          ASSET_URL_PROP=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "fusion-properties.json") | .browser_download_url')
          curl -fL -o public/fusion-data.json "$ASSET_URL_DATA"
          curl -fL -o public/fusion-properties.json "$ASSET_URL_PROP"

      - name: Commit and push updated fusion-data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/fusion-data.json
          git add public/fusion-properties.json
          git commit -m "Update fusion-data.json and fusion-properties.json from SkyShards-Parser $RELEASE_TAG" || echo "No changes to commit"
          git push origin HEAD:${{ env.TARGET_BRANCH }}
